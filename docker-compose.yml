services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped        # se a VM do Docker cair, o banco volta sozinho
    cpus: 3
    command: >
      postgres
      -c max_wal_size=4GB
      -c checkpoint_timeout=15min
      -c shared_buffers=256MB
    environment:
      POSTGRES_USER: radar
      POSTGRES_PASSWORD: radar
      POSTGRES_DB: radar
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # roda os scripts na primeira criação do volume
      - ./sql/schema:/docker-entrypoint-initdb.d:ro
volumes:
  pgdata:
